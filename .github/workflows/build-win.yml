name: Build Windows Kiosk App

on:
  workflow_dispatch:
  push:
    branches:
      - codex/app-windows

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static kiosk app
        run: npm run build:next

      - name: Verify static export
        run: npm run export

      - name: Package Windows artifacts
        run: npm run dist:win:all

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-kiosk
          path: dist/
          if-no-files-found: error
